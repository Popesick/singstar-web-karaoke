<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241247"/>
      <stop offset="1" stop-color="#0a0512"/>
    </linearGradient>
    <linearGradient id="mic" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2fa0"/>
      <stop offset="0.55" stop-color="#c23fd0"/>
      <stop offset="1" stop-color="#29e0ff"/>
    </linearGradient>
    <linearGradient id="barsLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff2fa0"/>
      <stop offset="1" stop-color="#a239d6"/>
    </linearGradient>
    <linearGradient id="barsRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#29e0ff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="192" height="192" rx="42" fill="url(#bg)"/>
  <rect x="4" y="4" width="192" height="192" rx="42" fill="none" stroke="#3a2a63" stroke-width="2"/>

  <!-- equalizer bars -->
  <g opacity="0.95">
    <rect x="26" y="92" width="12" height="26" rx="6" fill="url(#barsLeft)"/>
    <rect x="44" y="72" width="12" height="66" rx="6" fill="url(#barsLeft)"/>
    <rect x="62" y="52" width="12" height="96" rx="6" fill="url(#barsLeft)"/>
    <rect x="80" y="66" width="12" height="76" rx="6" fill="url(#barsLeft)"/>

    <rect x="108" y="78" width="12" height="58" rx="6" fill="url(#barsRight)"/>
    <rect x="126" y="58" width="12" height="88" rx="6" fill="url(#barsRight)"/>
    <rect x="144" y="70" width="12" height="70" rx="6" fill="url(#barsRight)"/>
    <rect x="162" y="94" width="12" height="24" rx="6" fill="url(#barsRight)"/>
  </g>

  <!-- cable -->
  <path d="M 78 150 C 95 150 100 168 118 168 C 138 168 138 148 156 148"
        fill="none" stroke="url(#mic)" stroke-width="7" stroke-linecap="round" opacity="0.9"/>

  <!-- microphone -->
  <g transform="rotate(-40 100 100)">
    <rect x="86" y="42" width="28" height="70" rx="14" fill="url(#mic)"/>
    <rect x="86" y="66" width="28" height="4" fill="#1a0f2e" opacity="0.55"/>
    <rect x="86" y="76" width="28" height="4" fill="#1a0f2e" opacity="0.55"/>
    <rect x="86" y="86" width="28" height="4" fill="#1a0f2e" opacity="0.55"/>
    <rect x="96" y="112" width="8" height="26" rx="4" fill="url(#mic)"/>
    <path d="M 74 112 a 26 26 0 0 0 52 0" fill="none" stroke="url(#mic)" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
